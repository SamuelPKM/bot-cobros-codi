# Blueprint de Render para Cóbrale: https://render.com/docs/blueprint-spec
#
# Crea un Web Service en el plan gratis. Los secretos no van aquí: Render los
# pide al aplicar el Blueprint (los que tienen `sync: false`).
#
# Límites del plan gratis que hay que conocer (detalle en docs/deploy-render.md):
#   - Se apaga tras 15 minutos sin visitas. Un "despertador" externo que visite
#     /health cada 10 minutos lo mantiene encendido.
#   - No admite discos: la base de datos SQLite se borra en cada despliegue o
#     reinicio.
#
# Guía paso a paso: docs/deploy-render.md

services:
  - type: web
    name: cobrale
    runtime: node
    plan: free
    # La región no se puede cambiar después de crear el servicio.
    region: virginia
    branch: main
    buildCommand: npm ci --omit=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # --- Secretos: Render los pide al aplicar el Blueprint ---
      - key: PEY_API_KEY
        sync: false
      # Se obtiene al registrar el webhook en portal.pey.mx, después del
      # primer despliegue. Puede quedar vacío mientras tanto.
      - key: PEY_WEBHOOK_SECRET
        sync: false

      # --- Configuración ---
      # Sin disco, la base vive en el sistema de archivos temporal del servicio.
      - key: DATABASE_FILE
        value: data/cobros.db
      - key: DEMO_ENABLED
        value: "true"
      - key: DEMO_MAX_AMOUNT
        value: "1"
      - key: DEMO_MERCHANT_NAME
        value: Negocio de prueba
      - key: TRUST_PROXY
        value: "true"
      # PUBLIC_BASE_URL no hace falta: Cóbrale usa RENDER_EXTERNAL_URL, que
      # Render llena con la URL pública del servicio.
