# Blueprint de Render para Cóbrale: https://render.com/docs/blueprint-spec
#
# Crea un Web Service en el plan gratis. Los datos viven en Postgres (Neon,
# también gratis), así que no se pierden en cada despliegue y el servicio puede
# tener varias instancias. Los secretos no van aquí: Render los pide al aplicar
# el Blueprint (los que tienen `sync: false`).
#
# Guía paso a paso: docs/deploy-render.md

services:
  - type: web
    name: cobrale
    runtime: node
    plan: free
    # La región no se puede cambiar después de crear el servicio. Conviene la
    # misma zona que la base de Neon (AWS us-east-1).
    region: virginia
    branch: main
    buildCommand: npm ci --omit=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # --- Secretos: Render los pide al aplicar el Blueprint ---
      - key: PEY_API_KEY
        sync: false
      # Se obtiene al registrar el webhook en portal.pey.mx, después del
      # primer despliegue. Puede quedar vacío mientras tanto.
      - key: PEY_WEBHOOK_SECRET
        sync: false
      # Cadena de conexión directa de Neon (sin "-pooler").
      - key: DATABASE_URL
        sync: false
      # Cuenta de la web para el jurado (opcional).
      - key: DEMO_ACCOUNT_EMAIL
        sync: false
      - key: DEMO_ACCOUNT_PASSWORD
        sync: false
      # Correos que cobran sin el límite del modo prueba (opcional).
      - key: TRUSTED_EMAILS
        sync: false

      # --- Configuración ---
      - key: DEMO_ENABLED
        value: "true"
      - key: DEMO_MAX_AMOUNT
        value: "1"
      - key: DEMO_MERCHANT_NAME
        value: Negocio de prueba
      - key: TRUST_PROXY
        value: "true"
      # PUBLIC_BASE_URL no hace falta: Cóbrale usa RENDER_EXTERNAL_URL, que
      # Render llena con la URL pública del servicio.
