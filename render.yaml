# Blueprint de Render para Cóbrale: https://render.com/docs/blueprint-spec
# Guía paso a paso: backend/docs/deploy.md
#
# La base de datos vive en Neon (DATABASE_URL), no en Render.
# Los secretos no van aquí: Render los pide al aplicar el Blueprint (sync: false).

services:
  - type: web
    name: cobrale-api
    runtime: node
    # La API vive en backend/ del monorepo (las apps de front en front/<app>).
    rootDir: backend
    # free: se duerme tras 15 min sin tráfico (el primer request tarda ~1 min y el
    # barrido no corre dormido). Para la evaluación del hackatón conviene starter.
    plan: free
    # Ohio, igual que Neon en AWS us-east-2: menos latencia entre API y base.
    region: ohio
    branch: main
    buildCommand: npm ci && npm run build
    # Corre las migraciones pendientes y arranca (preDeployCommand no existe en free).
    startCommand: npm run start:render
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: '22'

      # --- Secretos: Render los pide al aplicar el Blueprint ---
      # No hay API key de pey global: cada negocio registra la suya (POST /businesses).
      - key: DATABASE_URL
        sync: false
      # URL pública de este servicio (https://<nombre>.onrender.com), para la URL de webhook de cada negocio
      - key: PUBLIC_BASE_URL
        sync: false
      # URL de la web (Next.js), para las ligas de invitación y el regreso de la liga de pago
      - key: FRONTEND_URL
        sync: false
      # Orígenes de navegador que llaman la API: la web y la demo de Expo web, separados por coma
      - key: CORS_ORIGINS
        sync: false
      # WhatsApp Cloud API (Meta): las cuatro o ninguna (déjalas vacías para no usar WhatsApp)
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      # Demo pública: id del negocio de demostración del equipo (vacío = demo apagada)
      - key: DEMO_BUSINESS_ID
        sync: false
      - key: DEMO_MAX_AMOUNT
        value: '1'

      # --- Generados y fijos ---
      - key: AUTH_SECRET
        generateValue: true
      # 256 bits en base64: cifra las API keys de los negocios. NO la cambies
      # después: las credenciales guardadas dejarían de poder descifrarse.
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: DATABASE_SSL
        value: 'true'
      - key: TRUST_PROXY
        value: 'true'
